name: Remediate audited dependencies once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remediate-dependencies-once.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update direct packages with published fixes
        run: |
          npm pkg set 'dependencies.firebase-admin=13.10.0' 'dependencies.xlsx=npm:@keep-lts/xlsx@0.18.6' 'devDependencies.vite=7.3.7'
          npm install --package-lock-only --ignore-scripts
      - name: Apply non-breaking audit fixes
        run: npm audit fix --ignore-scripts || true
      - name: Regenerate and verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Verify production build
        run: npm run build
      - name: Report remaining audit findings
        run: npm audit --audit-level=high || true
      - name: Commit dependency changes and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/remediate-dependencies-once.yml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Update vulnerable dependencies and regenerate lockfile"
          git push origin HEAD:main
