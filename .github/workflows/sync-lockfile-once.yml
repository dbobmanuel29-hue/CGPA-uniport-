name: Sync dependency lockfile once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-lockfile-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean installation
        run: npm ci --ignore-scripts
      - name: Verify production build
        run: npm run build
      - name: Report dependency audit
        run: npm audit --audit-level=high || true
      - name: Commit lockfile and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/sync-lockfile-once.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "Regenerate dependency lockfile and verify clean install"
          git push origin HEAD:main
