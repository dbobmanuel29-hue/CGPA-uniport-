name: Remove unused vulnerable build plugin once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-unused-build-plugin-once.yml'

permissions:
  contents: write

jobs:
  remove-unused-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove unused plugin and refresh lockfile
        run: |
          npm pkg delete devDependencies.vite-plugin-singlefile
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Verify production build
        run: npm run build
      - name: Report remaining audit findings
        run: npm audit --audit-level=high || true
      - name: Commit verified dependency tree and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/remove-unused-build-plugin-once.yml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Remove unused vulnerable build plugin"
          git push origin HEAD:main
