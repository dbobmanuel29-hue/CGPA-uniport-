      #initial-loader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fbfbf7;color:#24332d;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease}
      #initial-loader.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
      #initial-loader .wordmark{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:clamp(42px,8vw,64px);font-weight:750;letter-spacing:-.075em;line-height:1}
      #initial-loader .word{color:#214c3e}
      #initial-loader .plus{color:#a5c950;margin-left:1px}
      #initial-loader .rule{width:150px;height:2px;margin-top:25px;overflow:hidden;background:#e4e8df}
      #initial-loader .rule span{display:block;width:45%;height:100%;background:#214c3e;animation:initial-loader-line 1.15s cubic-bezier(.65,.05,.35,1) infinite}
      #initial-loader .status{margin:13px 0 0;color:#7a817a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
      @keyframes initial-loader-line{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}
      @media(prefers-color-scheme:dark){#initial-loader{background:#101b16;color:#edf1e7}#initial-loader .word{color:#edf1e7}#initial-loader .rule{background:#304039}#initial-loader .rule span{background:#a3cdab}#initial-loader .status{color:#8f9a92}}

  <body>
    <div id="initial-loader" role="status" aria-label="Loading CGPA+ UniPort">
      <div class="wordmark" aria-hidden="true"><span class="word">CGPA</span><span class="plus">+</span></div>
      <div class="rule" aria-hidden="true"><span></span></div>
      <p class="status">Getting things ready</p>
    </div>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>CGPA Plus UniPort</h1>
        <p>CGPA Plus (CGPA+) is a GPA and CGPA calculator for University of Port Harcourt (UniPort) students.</p>
        <p>Calculate your GPA and CGPA, track academic progress, and plan target grades with CGPA Plus.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      #cgpa-install-button{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9990;display:none;align-items:center;gap:9px;padding:12px 16px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:#193a32;color:#fff;font:600 14px/1.1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 8px 28px rgba(15,35,27,.22);cursor:pointer}
      #cgpa-install-button svg{width:18px;height:18px;flex:none}
      #cgpa-install-button:focus-visible,#cgpa-ios-help button:focus-visible{outline:3px solid #a5c950;outline-offset:3px}
      #cgpa-ios-help{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center;padding:18px;background:rgba(12,24,18,.48);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #cgpa-ios-help[aria-hidden="false"]{display:flex}
      #cgpa-ios-help .sheet{width:min(100%,420px);padding:24px;border-radius:24px;background:#fbfbf7;color:#193a32;box-shadow:0 18px 60px rgba(0,0,0,.22)}
      #cgpa-ios-help h2{margin:0 0 10px;font-size:22px;letter-spacing:-.03em}
      #cgpa-ios-help p{margin:0 0 18px;line-height:1.6;color:#53645a;font-size:14px}
      #cgpa-ios-help button{width:100%;border:0;border-radius:12px;padding:13px 16px;background:#193a32;color:#fff;font:600 14px system-ui;cursor:pointer}
      @media(min-width:900px){#cgpa-install-button{right:24px;bottom:24px}}
      @media(prefers-reduced-motion:reduce){#cgpa-install-button{scroll-behavior:auto}}
    </style>
    <button id="cgpa-install-button" type="button" aria-label="Install CGPA Plus app">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Install CGPA+
    </button>
    <div id="cgpa-ios-help" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="cgpa-ios-title">
      <section class="sheet">
        <h2 id="cgpa-ios-title">Install CGPA+ on your iPhone</h2>
        <p>1. Tap the <strong>Share</strong> button in Safari.<br>2. Scroll down and choose <strong>Add to Home Screen</strong>.<br>3. Tap <strong>Add</strong> to finish.</p>
        <button id="cgpa-ios-close" type="button">Got it</button>
      </section>
    </div>
    <script>
      (() => {
        const installButton = document.getElementById("cgpa-install-button");
        const iosHelp = document.getElementById("cgpa-ios-help");
        const closeHelp = document.getElementById("cgpa-ios-close");
        const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        let installPrompt = null;

        if ("serviceWorker" in navigator && window.isSecureContext) {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("/sw.js").catch((error) => {
              console.warn("CGPA+ offline support could not be enabled:", error);
            });
          });
        }

        if (!isStandalone && isIOS) {
          installButton.style.display = "inline-flex";
          installButton.addEventListener("click", () => {
            iosHelp.setAttribute("aria-hidden", "false");
            closeHelp.focus();
          });
        }

        window.addEventListener("beforeinstallprompt", (event) => {
          event.preventDefault();
          installPrompt = event;
          if (!isStandalone) installButton.style.display = "inline-flex";
        });

        installButton.addEventListener("click", async () => {
          if (isIOS || !installPrompt) return;
          installPrompt.prompt();
          await installPrompt.userChoice;
          installPrompt = null;
          installButton.style.display = "none";
        });

        closeHelp.addEventListener("click", () => {
          iosHelp.setAttribute("aria-hidden", "true");
          installButton.focus();
        });
        iosHelp.addEventListener("click", (event) => {
          if (event.target === iosHelp) iosHelp.setAttribute("aria-hidden", "true");
        });
        window.addEventListener("appinstalled", () => {
          installButton.style.display = "none";
          installPrompt = null;
        });
      })();
    </script>
  </body>
